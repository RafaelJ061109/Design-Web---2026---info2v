<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 1 – Tailwind</title>
    <!-- Tailwind CSS v4 (browser) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://unpkg.com/phosphor-icons@latest/src/css/phosphor.css" />
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-between">
    <header class="bg-green-500 max-w-7x1 mx-auto flex-wrap px-6 p-6">
        <div>
            <!-- LOGO + SLOGAN -->
            <div>
                <h1 class="text-green-800 font-bold text-3x1 no-underline py-2">
                    <a href="/"
                        title="Instituto Federal de Educação, Ciência e Tecnologia do Estado do Rio Grande do Norte">
                        INSTITUTO FEDERAL
                    </a>
                </h1>
                <p class="slogan hidden md:block">
                    Educação, Ciência, Cultura e Tecnologia em todo o Rio Grande do Norte
                </p>
            </div>

            <!-- MENU HAMBÚRGUER (mobile) -->
            <button id="menuToggle" aria-label="Menu" class="md:hidden no-border bg-transparent p-2 hover:text-green-900">
                <i class="ph ph-list">Mobile</i>
            </button>

            <!-- NAVEGAÇÃO PRINCIPAL (desktop) -->
            <nav aria-label="Navegação principal">
                <ul class="flex hidden md:flex gap-6 items-center">
                    <a href="#">Processos seletivos</a>
                    <a href="#">Cursos</a>
                    <a href="#">Campi</a>
                    <a href="#">Institucional</a>
                    <a href="#">Acesso à Informação</a>
                    <a href="#">Eventos</a>
                    <a href="#">Serviços</a>
                </ul>
            </nav>

            <!-- AÇÕES (ícones, busca, contraste, modo escuro) -->
            <div>
                <!-- Ícones sociais -->
                <div>
                    <ul class="social flex items-center gap-3">
                        <a href="#" aria-label="Instagram"><i class="ph ph-instagram-logo"></i></a>
                        <a href="#" aria-label="Twitter"><i class="ph ph-twitter-logo"></i></a>
                        <a href="#" aria-label="LinkedIn"><i class="ph ph-linkedin-logo"></i></a>
                        <a href="#" aria-label="YouTube"><i class="ph ph-youtube-logo"></i></a>
                        <a href="#" aria-label="Spotify"><i class="ph ph-spotify-logo"></i></a>
                        <a href="#" aria-label="TikTok"><i class="ph ph-tiktok-logo"></i></a>
                    </ul>
                </div>

                <ul class="actions flex items-center gap-3">
                    <!-- Busca -->
                    <form method="get" action="/search/">
                        <input type="search" name="query" placeholder="Busca" aria-label="Busca" class="border rounded-full px3 py-1 bg-gray-100 focus:outline-none focus:ring" />
                        <button type="submit" aria-label="Pesquisar" class="flex items-center">
                            <i class="ph ph-magnifying-glass"></i>
                        </button>
                    </form>

                    <!-- Alto contraste -->
                    <button id="altocontraste" type="button" aria-label="Alto contraste" class="transition transition-opacity transition-colors duration-75 hover:scale-110">
                        <i class="ph ph-contrast">Alto constraste</i>
                    </button>

                    <!-- Modo escuro -->
                    <button type="button" aria-label="Modo escuro" class="transition transition-opacity transition-colors duration-75 hover:scale-110">
                        <i class="ph ph-moon">Modo escuro</i>
                    </button>
                </ul>
            </div>
        </div>
    </header>

</body>

</html>
